name: text-relay
services:
  app:
    image: text-relay:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/textrelay.db
      COOKIE_SECURE: 'true'
    ports:
      - '127.0.0.1:18080:3000'
    volumes:
      - textrelay-data:/app/data
      - textrelay-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health',{headers:{Host:new URL(process.env.APP_ORIGIN).host}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  textrelay-data:
  textrelay-backups:
